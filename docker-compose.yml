services:
  postgres:
    image: postgres:16-alpine
    container_name: airvent-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      POSTGRES_USER: airvent
      POSTGRES_PASSWORD: airvent_password
      POSTGRES_DB: airvent
    volumes:
      - airvent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airvent -d airvent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airvent-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgresql://airvent:airvent_password@postgres:5432/airvent
      AIR_API_BASE_URL: "https://apis.data.go.kr/B552584/ArpltnInforInqireSvc"
      AIR_STATION_API_BASE_URL: "https://apis.data.go.kr/B552584/MsrstnInfoInqireSvc"
      AIR_FETCH_STATION_INFO: "true"
      AIR_API_KEY: ""
      CRON_SECRET: change-me
      ADMIN_SECRET: change-me-admin
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ""
      RUN_MOCK_PIPELINE_ON_START: "true"
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    container_name: airvent-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TZ: Asia/Seoul
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - airvent-caddy-data:/data
      - airvent-caddy-config:/config

volumes:
  airvent-postgres-data:
  airvent-caddy-data:
  airvent-caddy-config:
